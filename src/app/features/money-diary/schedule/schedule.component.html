<div class="main-content">
  <app-grid
    [style]="{
      width: '100vw',
      height: 'calc(100vh - 230px)',
    }"
    [tbl]="tbl()"
    [colDefs]="colDefs()"
    [rows]="rows()"
    [cellClickForbCols]="cellClickForbCols"
    (rowEdt)="rowEdt.emit($event)"
    (cellClick)="onClickCell($event)"
  />
</div>
