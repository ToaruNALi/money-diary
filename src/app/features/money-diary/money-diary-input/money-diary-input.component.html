<!-- 収支合計 -->
<app-money-status
  [list]="statusList()"
  (click)="onClickStatusContent()"
></app-money-status>

<!-- 収支入力グリッド -->
<div class="main-content">
  <app-grid
    [style]="{
      width: '100vw',
      height: 'calc(100vh - 200px - 25px - 25px)',
    }"
    [tbl]="tbl()"
    [colDefs]="colDefs()"
    [rows]="rows()"
    [aboveContentOption]="aboveContentOption()"
    [belowContentOpt]="belowContentOption()"
    [cellClickForbCols]="cellClickForbColumns"
    [emptyRowJudgeFn]="emptyRowJudgeFn"
    (rowEdt)="rowEdt.emit($event)"
    (gridReady)="onReadyGrid($event)"
    (cellClick)="onClickCell($event)"
    (cellContextMenu)="onCellContextMenu($event)"
  />
</div>

<!-- コンテキストメニュー -->
<div
  class="grid-menu"
  [class.grid-menu-disp]="gridMenuDsp()"
  [style]="gridMenuStyle()"
>
  <button
    mat-menu-item
    (click)="onDelete()"
    [disabled]="gridmenuItemDisabled()"
  >
    <mat-icon>delete</mat-icon>
    <span>Delete</span>
  </button>
  <button
    mat-menu-item
    (click)="onReplace()"
    [disabled]="gridmenuItemDisabled()"
  >
    <mat-icon>find_replace</mat-icon>
    <span>Replace</span>
  </button>
  <button
    mat-menu-item
    (click)="onSerialNumber()"
    [disabled]="gridmenuItemDisabled()"
  >
    <mat-icon>123</mat-icon>
    <span>Serial Number</span>
  </button>
  <button
    mat-menu-item
    (click)="onUpdate()"
    [disabled]="gridmenuItemDisabled()"
  >
    <mat-icon>edit</mat-icon>
    <span>Update</span>
  </button>
</div>
