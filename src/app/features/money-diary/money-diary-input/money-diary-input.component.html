<!-- 収支合計 -->
<app-money-status
  [list]="statusList()"
  (click)="onClickStatusContent()"
></app-money-status>

<!-- 収支入力グリッド -->
<div class="main-content">
  <app-grid
    [gridInput]="gridInput()"
    (rowEdt)="rowEdt.emit($event)"
    (gridReady)="onReadyGrid($event)"
    (cellClick)="onClickCell($event)"
    (cellContextMenu)="onCellContextMenu($event)"
  />
</div>
