<div mat-dialog-content class="dialog-content">
  <app-grid
    [style]="{
      width: 'calc(65vw)',
      height: 'calc(100vh - 375px)',
    }"
    [rowDataKey]="rowDataKey"
    [columnDefs]="columnDefs()"
    [rows]="rows()"
    (rowEdt)="rowEdt.emit($event)"
    (cellValueChange)="onChangeCellValue($event)"
  />
</div>
