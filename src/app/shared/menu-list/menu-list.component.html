<button
  mat-icon-button
  [matMenuTriggerFor]="menu1"
  [matMenuTriggerData]="{ list: menuList() }"
>
  <mat-icon>{{ icon() }}</mat-icon>
</button>

<!-- メニュー1 -->
<mat-menu #menu1="matMenu">
  <ng-template matMenuContent let-menuList="list">
    @for (menu of menuList; track menu.id) {
      @if (!!menu.children) {
        <button
          mat-menu-item
          [matMenuTriggerFor]="menu2"
          [matMenuTriggerData]="{ list: menu.children }"
        >
          <mat-icon>{{ menu.ic }}</mat-icon>
          <span>{{ menu.lb }}</span>
        </button>
      } @else {
        <button mat-menu-item (click)="onClickMenu(menu.id)">
          <mat-icon>{{ menu.ic }}</mat-icon>
          <span>{{ menu.lb }}</span>
        </button>
      }
    }
  </ng-template>
</mat-menu>
