<mat-form-field class="form-field" appearance="outline">
  <mat-label>{{ reqData().label }}</mat-label>
  <input
    matInput
    [style]="reqData().style"
    [formControl]="control()"
    [matAutocomplete]="auto"
    [readonly]="reqData().readonly"
    [placeholder]="reqData().placeholder"
    appInputRestrictions
    [inputRestrictions]="reqData().forbiddenChars"
    [invalidReservedWord]="option().invalidReservedWord"
  />
  <mat-autocomplete
    #auto="matAutocomplete"
    (optionSelected)="onSelectAutoComp($event)"
  >
    @for (option of reqData().filteredOptions$ | async; track option.id) {
      <mat-option [value]="option.value">{{ option.lb }}</mat-option>
    }
  </mat-autocomplete>
  <app-form-clear-button
    matSuffix
    [disabled]="control().disabled || reqData().readonly"
    [value]="control().value"
    (clearBtnClick)="onClickClearBtn()"
  />
</mat-form-field>
